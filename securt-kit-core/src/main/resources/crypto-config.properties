# 数据库字段加密配置文件
# 此文件用于配置数据库字段的加密和解密设置

# 加密算法配置
crypto.algorithm=AES
crypto.key=MySecretKey12345
crypto.transformation=AES/CBC/PKCS5Padding

# 需要加密的字段配置
# 格式: 表名.字段名，多个字段用逗号分隔
crypto.encrypt.fields=users.name,users.email,users.phone,orders.customer_name,orders.customer_phone

# 需要解密的字段配置
# 格式: 表名.字段名，多个字段用逗号分隔
crypto.decrypt.fields=users.name,users.email,users.phone,orders.customer_name,orders.customer_phone

# 日志配置
crypto.logging.enabled=true
crypto.logging.level=FINE

# 性能配置
crypto.performance.cache.enabled=true
crypto.performance.cache.size=1000
crypto.performance.cache.ttl=3600

# 安全配置
crypto.security.key.rotation.enabled=false
crypto.security.key.rotation.interval=86400
