<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Securt-Kit 加密解密工具</title>
    <link rel="stylesheet" href="/monitor/css/style.css">
</head>
<body>
    <!-- 登录页面 -->
    <div id="loginPage" class="page">
        <div class="login-container">
            <h1>Securt-Kit 监控页面</h1>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">用户名:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">密码:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div id="loginError" class="error-message"></div>
                <button type="submit" class="btn btn-primary">登录</button>
            </form>
        </div>
    </div>

    <!-- 主功能页面 -->
    <div id="mainPage" class="page" style="display: none;">
        <header class="header">
            <h1>Securt-Kit 加密解密工具</h1>
            <button id="logoutBtn" class="btn btn-secondary">退出</button>
        </header>

        <div class="container">
            <!-- 标签页导航 -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="crypto">加密解密</button>
                <button class="tab-btn" data-tab="sqlParse">SQL 解析</button>
            </div>

            <!-- 加密解密标签页 -->
            <div id="cryptoTab" class="tab-content active">
                <div class="card">
                    <h2>字符串加密解密</h2>
                    <div class="form-group">
                        <label>输入内容:</label>
                        <textarea id="cryptoInput" rows="4" placeholder="请输入要加密或解密的文本"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>表名（可选）:</label>
                            <input type="text" id="cryptoTableName" placeholder="例如: user">
                        </div>
                        <div class="form-group">
                            <label>字段名（可选）:</label>
                            <input type="text" id="cryptoFieldName" placeholder="例如: name">
                        </div>
                        <div class="form-group">
                            <label>策略类名（可选）:</label>
                            <input type="text" id="cryptoStrategy" placeholder="例如: com.example.Strategy">
                        </div>
                    </div>
                    <div class="button-group">
                        <button id="encryptBtn" class="btn btn-primary">加密</button>
                        <button id="decryptBtn" class="btn btn-primary">解密</button>
                        <button id="clearBtn" class="btn btn-secondary">清空</button>
                    </div>
                    <div class="form-group">
                        <label>输出结果:</label>
                        <textarea id="cryptoOutput" rows="4" readonly></textarea>
                    </div>
                    <button id="copyBtn" class="btn btn-secondary" style="display: none;">复制结果</button>
                </div>
            </div>

            <!-- SQL 解析标签页 -->
            <div id="sqlParseTab" class="tab-content">
                <div class="card">
                    <h2>SQL 解析</h2>
                    <div class="form-group">
                        <label>输入 SQL:</label>
                        <textarea id="sqlInput" rows="6" placeholder="请输入要解析的 SQL 语句，例如: UPDATE user SET name = ?, phone = ? WHERE id = ?"></textarea>
                    </div>
                    <div class="button-group">
                        <button id="parseSqlBtn" class="btn btn-primary">解析</button>
                        <button id="clearSqlBtn" class="btn btn-secondary">清空</button>
                    </div>
                    <div id="parseSqlResult" style="display: none;">
                        <div class="form-group">
                            <label>占位符映射:</label>
                            <div id="placeholderTable" class="result-table"></div>
                        </div>
                        <div class="form-group">
                            <label>需要加密的字段:</label>
                            <div id="encryptFieldsTable" class="result-table"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/monitor/js/app.js"></script>
</body>
</html>
