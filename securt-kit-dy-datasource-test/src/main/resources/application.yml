spring:
  # 应用名称
  application:
    name: securt-kit-multi-datasource-demo
  
  # MyBatis-Plus 多数据源配置（使用 dynamic-datasource）
  datasource:
    # 动态数据源配置
    dynamic:
      # 是否启用严格模式（默认 false，建议开启）
      strict: true
      # 主数据源（默认数据源）
      primary: primary
      # 数据源配置
      datasource:
        # 主数据源
        primary:
          driver-class-name: io.github.hexlodev.core.interceptor.SimpleInterceptorDriver
          # 通过 URL 参数传递数据源标识（通用方式，适用于所有连接池）
          # 注意：H2 数据库使用 ; 作为参数分隔符，MySQL 等使用 ? 或 &
          url: 'jdbc:interceptor:h2:mem:primary_db;DB_CLOSE_DELAY=-1;MODE=MySQL;datasource-id=primary'
          username: sa
          password:
          hikari:
            maximum-pool-size: 5
            minimum-idle: 1
        # 从数据源
        secondary:
          driver-class-name: io.github.hexlodev.core.interceptor.SimpleInterceptorDriver
          # 通过 URL 参数传递数据源标识（通用方式，适用于所有连接池）
          url: 'jdbc:interceptor:h2:mem:secondary_db;DB_CLOSE_DELAY=-1;MODE=MySQL;datasource-id=secondary'
          username: sa
          password:
          hikari:
            maximum-pool-size: 5
            minimum-idle: 1
        # 第三方数据源
        third:
          driver-class-name: io.github.hexlodev.core.interceptor.SimpleInterceptorDriver
          # 通过 URL 参数传递数据源标识（通用方式，适用于所有连接池）
          url: 'jdbc:interceptor:h2:mem:third_db;DB_CLOSE_DELAY=-1;MODE=MySQL;datasource-id=third'
          username: sa
          password:
          hikari:
            maximum-pool-size: 5
            minimum-idle: 1
  
  # SQL 初始化配置
  sql:
    init:
      mode: never  # 多数据源测试中手动初始化表结构

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: io.github.test.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 数据库类型：H2
      db-type: h2
      # 表名策略：使用下划线命名
      table-underline: true

# 日志配置
logging:
  level:
    root: INFO
    io.github.test: DEBUG
    io.github.hexlodev.core: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 服务器配置
server:
  port: 8081

# 多数据源加密配置（新配置方式：在 tables 中直接指定 datasource-id）
securtkit:
  encryptor:
    enable: true
    failure-policy: FALLBACK
    sql-parse-cache:
      enable: true
      max-size: 1000
    tables:
      # 主数据源配置（primary）：加密 name 和 phone
      # 注意：配置中的表名不需要双引号，系统会自动处理
      - table-name: user
        datasource-id: primary
        fields:
          - field-name: name
          - field-name: phone
      
      # 从数据源配置（secondary）：只加密 name
      - table-name: user
        datasource-id: secondary
        fields:
          - field-name: name
      
      # 第三方数据源不配置（等于关闭加密）

