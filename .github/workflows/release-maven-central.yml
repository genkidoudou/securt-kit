name: Release to Maven Central

# 手动触发：升版 → GPG 签名 → 发布到 Central Publisher Portal → 打 tag → 回写下一 SNAPSHOT
# 所需 Secrets（仓库 Settings → Secrets and variables → Actions）：
#   CENTRAL_USERNAME      Portal User Token 用户名
#   CENTRAL_PASSWORD      Portal User Token 密码
#   GPG_PRIVATE_KEY       私钥 ASCII（gpg --armor --export-secret-keys KEYID）
#   GPG_PASSPHRASE        私钥口令（无则填空字符串 secret 也可）
# 可选：
#   GPG_KEY_ID            签名用 key id（未设则用导入的默认钥）

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 版本递增方式（相对当前 POM 去掉 -SNAPSHOT 后）
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
        default: patch
      version:
        description: bump=custom 时填写，例如 1.0.0（不要带 v / -SNAPSHOT）
        type: string
        required: false
        default: ""
      auto_publish:
        description: Portal 校验通过后是否自动 Publish（false 则仅上传，需网页手动 Publish）
        type: boolean
        default: true
      dry_run:
        description: 只升版并 package，不 deploy、不推 git
        type: boolean
        default: false

concurrency:
  group: maven-central-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Resolve release version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "current=${CURRENT}"
          BASE="${CURRENT%-SNAPSHOT}"
          IS_SNAPSHOT=false
          [[ "$CURRENT" == *-SNAPSHOT ]] && IS_SNAPSHOT=true
          BUMP="${{ inputs.bump }}"
          CUSTOM="${{ inputs.version }}"

          normalize3() {
            local v="$1"
            IFS=. read -r a b c _ <<< "${v}.."
            a=${a:-0}; b=${b:-0}; c=${c:-0}
            [[ -z "$c" ]] && c=0
            echo "${a}.${b}.${c}"
          }

          if [[ "$BUMP" == "custom" ]]; then
            if [[ -z "$CUSTOM" ]]; then
              echo "::error::bump=custom 时必须填写 version"
              exit 1
            fi
            RELEASE="${CUSTOM#v}"
            RELEASE="${RELEASE%-SNAPSHOT}"
            RELEASE="$(normalize3 "$RELEASE")"
          else
            NORM="$(normalize3 "$BASE")"
            IFS=. read -r MAJOR MINOR PATCH <<< "${NORM}"
            if [[ "$IS_SNAPSHOT" == "true" ]]; then
              # 1.0-SNAPSHOT + patch → 发布 1.0.0（去掉 SNAPSHOT，不先 +1）
              case "$BUMP" in
                major) RELEASE="$((MAJOR + 1)).0.0" ;;
                minor) RELEASE="${MAJOR}.$((MINOR + 1)).0" ;;
                patch) RELEASE="${MAJOR}.${MINOR}.${PATCH}" ;;
                *) echo "::error::未知 bump=$BUMP"; exit 1 ;;
              esac
            else
              case "$BUMP" in
                major) RELEASE="$((MAJOR + 1)).0.0" ;;
                minor) RELEASE="${MAJOR}.$((MINOR + 1)).0" ;;
                patch) RELEASE="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
                *) echo "::error::未知 bump=$BUMP"; exit 1 ;;
              esac
            fi
          fi

          if [[ ! "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::非法版本号: ${RELEASE}"
            exit 1
          fi

          IFS=. read -r R_MAJOR R_MINOR R_PATCH <<< "${RELEASE}"
          NEXT_SNAPSHOT="${R_MAJOR}.${R_MINOR}.$((R_PATCH + 1))-SNAPSHOT"

          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "next_snapshot=${NEXT_SNAPSHOT}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${RELEASE}"
          echo "Next SNAPSHOT: ${NEXT_SNAPSHOT}"

      - name: Import GPG key
        if: ${{ !inputs.dry_run }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "${GPG_PRIVATE_KEY:-}" ]]; then
            echo "::error::缺少 GPG_PRIVATE_KEY Secret"
            exit 1
          fi

          # 不用 crazy-max/import-gpg：短 KEYID 作 fingerprint 时会触发
          # ERR 67108933 Not implemented <GPG Agent>
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf 'batch\npinentry-mode loopback\n' > ~/.gnupg/gpg.conf
          printf 'allow-loopback-pinentry\n' > ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true

          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: Set release version in POMs
        run: |
          set -euo pipefail
          # -Prelease 会把 securt-kit-starter-boot3 纳入 reactor
          mvn -B -Prelease versions:set \
            -DnewVersion="${{ steps.ver.outputs.release }}" \
            -DgenerateBackupPoms=false \
            -DprocessAllModules=true

      - name: Deploy to Maven Central
        if: ${{ !inputs.dry_run }}
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CENTRAL_USERNAME:-}" || -z "${CENTRAL_PASSWORD:-}" ]]; then
            echo "::error::缺少 CENTRAL_USERNAME / CENTRAL_PASSWORD Secrets"
            exit 1
          fi

          AUTO="${{ inputs.auto_publish }}"
          WAIT="validated"
          if [[ "${AUTO}" == "true" ]]; then
            WAIT="published"
          fi

          GPG_ARGS=(-Dgpg.passphrase="${GPG_PASSPHRASE}")
          # 可选：指定签名钥（短/长 KEYID 或指纹均可）
          if [[ -n "${GPG_KEY_ID:-}" ]]; then
            GPG_ARGS+=(-Dgpg.keyname="${GPG_KEY_ID}")
          fi

          # 发布库模块（含 Boot3 starter）；test/playground 已 maven.deploy.skip
          mvn -B -Prelease \
            -Dcentral.autoPublish="${AUTO}" \
            -Dcentral.waitUntil="${WAIT}" \
            -DskipTests \
            "${GPG_ARGS[@]}" \
            clean deploy \
            -pl securt-kit-core,securt-kit-monitor,securt-kit-mybatis,securt-kit-starter-boot2,securt-kit-starter-boot3 \
            -am

      - name: Dry-run package only
        if: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          mvn -B -Prelease -DskipTests clean package \
            -pl securt-kit-core,securt-kit-monitor,securt-kit-mybatis,securt-kit-starter-boot2,securt-kit-starter-boot3 \
            -am

      - name: Commit release, tag, bump SNAPSHOT
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          RELEASE="${{ steps.ver.outputs.release }}"
          NEXT="${{ steps.ver.outputs.next_snapshot }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "release: v${RELEASE} [skip ci]"
          fi

          git tag -a "v${RELEASE}" -m "Release v${RELEASE}"

          mvn -B -Prelease versions:set \
            -DnewVersion="${NEXT}" \
            -DgenerateBackupPoms=false \
            -DprocessAllModules=true

          git add -A
          git commit -m "chore: next version ${NEXT} [skip ci]"

          git push origin HEAD
          git push origin "v${RELEASE}"
